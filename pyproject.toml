[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebookapp"
version = "1.0.0"
description = "Geschützte Auslieferung von E-Books über persönliche Downloadlinks"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "pillow>=11",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2", "ruff>=0.6"]

[project.scripts]
ebookctl = "ebookapp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ebookapp = ["templates/**/*.html", "static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/ebookapp/static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = [
    "S101",   # assert in Tests
    "B008",   # FastAPI Depends() in Signaturen
    "RUF001", # deutsche Typografie in Texten
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S108", "S603", "S607"]
"src/ebookapp/translations_en.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
