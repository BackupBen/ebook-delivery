# Prüft jeden Stand und veröffentlicht das Image in der Container-Registry des Repositorys.
#
# Es sind keine Konto- oder Servernamen eingetragen: Das Image heißt wie das Repository
# (ghcr.io/<konto>/<repository>), angemeldet wird mit dem automatisch bereitgestellten
# GITHUB_TOKEN. Zusätzliche Secrets sind nicht nötig.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linter und Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: restic installieren (für die Backup-Tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends restic
      - name: Abhängigkeiten installieren
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Linter
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: pytest --show-capture=no

  image:
    name: Image bauen und veröffentlichen
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - name: Image bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ebook-delivery:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container starten und End-to-End-Test ausführen
        run: |
          docker run -d --name app --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -p 127.0.0.1:8000:8000 \
            -e SECRET_KEY="$(openssl rand -base64 48)" \
            -e ADMIN_PASSWORD=ci-testpasswort-123456 \
            -e BACKUP_PASSWORD=ci-backup-passwort \
            -e PUBLIC_BASE_URL=http://127.0.0.1:8000 ebook-delivery:ci
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          test "$(docker exec app id -u)" = "10001"
          BASE_URL=http://127.0.0.1:8000 ADMIN_PASSWORD=ci-testpasswort-123456 bash scripts/e2e.sh
          docker exec app ebookctl backup
          docker exec app ebookctl restore
          docker logs app
      - name: Bei der Registry anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image veröffentlichen
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
